<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1355" viewBox="0 0 1440 1355" role="img" aria-labelledby="title desc"><title id="title">Required periods, downloads and retries</title><desc id="desc">The workflow checks file presence, creates monthly folders, navigates SAP and checks download completion. Existing files skip extraction. Incomplete downloads are rechecked; timeouts enter retry handling or review.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#b6c4d8" stroke-width="1.4"/></marker></defs><rect width="1440" height="1355" rx="24" fill="#101b2d"/><text x="56" y="63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#b9f4d0">EXTENDED PPO WORKFLOW</text><text x="56" y="112" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#f5f7fb">Reporting controls added to PPO</text><text x="56" y="152" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Reconstructed from project experience · These extensions are not in the consignment source.</text><rect x="440" y="205" width="520" height="110" rx="18" fill="#18273c" stroke="#35465e"/><text x="464" y="245" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Select country + reporting period</text><text x="464" y="280" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Current / prior / opening, plus requested history</text><path d="M700 315V351" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 354.0L940.0 430L700 506.0L460.0 430Z" fill="#223849" stroke="#6c8b86" stroke-width="2"/><text x="700" y="423" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f5f7fb">Required file</text><text x="700" y="454" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f5f7fb">exists?</text><path d="M460 430H189V1175H438" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="228" y="413" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Yes</text><text x="230" y="560" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#b9f4d0">Existing file</text><text x="230" y="595" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">meets the</text><text x="230" y="626" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">presence check.</text><path d="M700 506V552" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="721" y="538" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">No</text><rect x="440" y="556" width="520" height="99" rx="18" fill="#18273c" stroke="#35465e"/><text x="464" y="596" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Create or confirm monthly folder</text><text x="464" y="631" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Use the established year/month structure.</text><path d="M700 655V694" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="698" width="520" height="110" rx="18" fill="#18273c" stroke="#35465e"/><text x="464" y="738" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Navigate SAP + trigger export</text><text x="464" y="773" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Detect window; select country and report date.</text><path d="M700 808V851" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 854.0L940.0 930L700 1006.0L460.0 930Z" fill="#223849" stroke="#6c8b86" stroke-width="2"/><text x="700" y="923" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f5f7fb">Download</text><text x="700" y="954" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" fill="#f5f7fb">complete?</text><path d="M700 1006V1049" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="720" y="1038" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Yes</text><rect x="440" y="1053" width="520" height="86" rx="18" fill="#18273c" stroke="#35465e"/><text x="464" y="1093" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Place completed file in archive</text><path d="M700 1139V1163" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="440" y="1167" width="520" height="95" rx="18" fill="#18273c" stroke="#35465e"/><text x="464" y="1207" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Next country or reporting period</text><text x="464" y="1242" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Finish when the selected queue is complete.</text><path d="M940 930H1035" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="981" y="914" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">No</text><rect x="1041" y="875" width="337" height="110" rx="18" fill="#18273c" stroke="#35465e"/><text x="1065" y="915" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Wait + check again</text><text x="1065" y="950" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Recheck while downloading.</text><path d="M1153 875V837H833V896" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1209 985V1036" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1227" y="1022" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Timeout</text><rect x="1041" y="1040" width="337" height="96" rx="18" fill="#18273c" stroke="#35465e"/><text x="1065" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" fill="#f5f7fb">Retry or flag incomplete</text><text x="1065" y="1115" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Review if retries are exhausted.</text><path d="M1378 1087H1410V752H962" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1045" y="731" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b6c4d8">Retry if available</text><text x="1044" y="1178" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#b6c4d8">Also handles window/export timeouts.</text><text x="56" y="1311" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#b9f4d0">Presence ≠ freshness. Download completion ≠ accounting reconciliation.</text></svg>