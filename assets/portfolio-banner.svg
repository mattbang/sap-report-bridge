<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="612" viewBox="0 0 1440 612" role="img" aria-labelledby="title desc"><title id="title">SAP Report Bridge</title><desc id="desc">A portfolio case study of interactive SAP automation supporting eight countries and recurring analytical inputs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#b6c4d8" stroke-width="1.4"/></marker></defs><rect width="1440" height="612" rx="24" fill="#101b2d"/><text x="64" y="69" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#b9f4d0">SAP / AUTOMATION / BUSINESS INTELLIGENCE</text><text x="64" y="159" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="700" fill="#f5f7fb">SAP Report Bridge</text><text x="68" y="223" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400" fill="#f5f7fb">From hard-to-reach reports</text><text x="68" y="270" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="400" fill="#f5f7fb">to decision-ready data.</text><text x="68" y="332" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b6c4d8">A shared automation approach for consignment stock</text><text x="68" y="367" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#b6c4d8">and custom month-end reporting.</text><rect x="68" y="441" width="234" height="39" rx="19" fill="#18273c" stroke="#35465e"/><text x="86" y="467" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#b9f4d0">PYTHON + WINDOWS</text><rect x="316" y="441" width="252" height="39" rx="19" fill="#18273c" stroke="#35465e"/><text x="334" y="467" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#b9f4d0">REPORT AUTOMATION</text><rect x="582" y="441" width="243" height="39" rx="19" fill="#18273c" stroke="#35465e"/><text x="600" y="467" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#b9f4d0">BUSINESS IMPACT</text><rect x="949" y="99" width="421" height="394" rx="22" fill="#1c3045" stroke="#466253"/><text x="982" y="148" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#b9f4d0">PPO REPORTING IMPACT</text><text x="981" y="245" font-family="Arial, Helvetica, sans-serif" font-size="90" font-weight="700" fill="#f5f7fb">08</text><text x="984" y="287" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#f5f7fb">countries in the PPO case</text><path d="M984 320H1336" stroke="#466253"/><text x="984" y="359" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#b6c4d8">Consignment: surviving source</text><text x="984" y="396" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#b6c4d8">PPO: extended reporting case</text><text x="984" y="433" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#b6c4d8">One shared automation story</text><text x="68" y="563" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#b6c4d8">PROJECT CASE STUDY</text><text x="945" y="563" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600" fill="#b9f4d0">REPORT ACCESS → ANALYTICAL VALUE</text></svg>