<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="750" viewBox="0 0 1440 750" role="img" aria-labelledby="title desc"><title id="title">One foundation, two SAP reporting applications</title><desc id="desc">The early PPO desktop automation foundation was adapted for consignment stock, whose Python source survives. The PPO workflow was extended with historical downloads and reporting controls, described by the project owner.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9" fill="none" stroke="#b6c4d8" stroke-width="1.4"/></marker></defs><rect width="1440" height="750" rx="24" fill="#101b2d"/><text x="56" y="64" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#b9f4d0">PROJECT EVOLUTION</text><text x="56" y="114" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#f5f7fb">One foundation, two reporting applications</text><rect x="56" y="259" width="400" height="204" rx="18" fill="#18273c" stroke="#35465e"/><text x="82" y="301" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="600" fill="#b9f4d0">SHARED ORIGIN</text><text x="82" y="350" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f5f7fb">Early PPO automation</text><text x="82" y="395" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">Interactive SAP navigation</text><text x="82" y="427" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">Report export + file organization</text><path d="M456 361H536V254H610" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="468" y="231" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#b6c4d8">Adapted</text><path d="M536 361V526H610" fill="none" stroke="#b6c4d8" stroke-width="2.5" marker-end="url(#arrow)"/><text x="468" y="568" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#b6c4d8">Extended</text><rect x="617" y="169" width="767" height="205" rx="18" fill="#18273c" stroke="#35465e"/><text x="646" y="210" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#b9f4d0">CONSIGNMENT STOCK / SURVIVING SOURCE</text><text x="646" y="254" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#f5f7fb">The technical foundation, preserved</text><text x="646" y="298" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">Python + pywinauto · Sales-organization loops</text><text x="646" y="332" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">Monthly folders · Export dialogs · File-presence / recency checks</text><rect x="617" y="439" width="767" height="213" rx="18" fill="#18273c" stroke="#35465e"/><text x="646" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#b8ceff">PPO / DOCUMENTED PROJECT EXPERIENCE</text><text x="646" y="526" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#f5f7fb">Additional controls for management reporting</text><text x="646" y="570" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">Historical batch extraction across 8 countries</text><text x="646" y="604" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#b6c4d8">Current / prior / opening coverage · Completion checks + retries</text><text x="56" y="708" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#b6c4d8">Lineage confirmed by the project owner · Original PPO macro unavailable · Operational source excluded</text></svg>